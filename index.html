<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>لوحة إدارة الحضور - MUC</title><style>:root{--bg:#f6f3f2;--card:#fff;--tx:#1f1a1a;--mu:#6b6262;--p:#7a1f2b;--p2:#5c1520;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--bd:#e7dedc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161112;--card:#211a1b;--tx:#f0e9e8;--mu:#a99c9b;--p:#d9677a;--p2:#b94a5e;--ok:#4ade80;--okb:#10331f;--bad:#f87171;--badb:#3a1616;--bd:#38292b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161112;--card:#211a1b;--tx:#f0e9e8;--mu:#a99c9b;--p:#d9677a;--p2:#b94a5e;--ok:#4ade80;--okb:#10331f;--bad:#f87171;--badb:#3a1616;--bd:#38292b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.6}
.top{background:#fff;border-bottom:4px solid #7a1f2b;padding:8px 16px;display:flex;align-items:center;justify-content:space-between}.top img{height:50px}.top b{color:#5c1520;font-size:13px}
main{max-width:520px;margin:0 auto;padding:14px;display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
h2{margin:0 0 8px;font-size:15px;color:var(--p)}label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:11px 14px;border:0;border-radius:8px;background:var(--p2);color:#fff;font:inherit;cursor:pointer}button.s{background:transparent;color:var(--p);border:1px solid var(--p);padding:7px 10px;font-size:13px}button:disabled{opacity:.5}
.msg{border-radius:12px;padding:16px;text-align:center;font-weight:bold}.msg small{display:block;font-weight:normal;margin-top:4px}.ok{background:var(--okb);color:var(--ok)}.bad{background:var(--badb);color:var(--bad)}.mu{color:var(--mu);font-size:12px}

function renderDocs(){
 const ids=Object.keys(docs).sort((a,b)=>ar(docs[a].name,docs[b].name));
 $('dl').innerHTML=ids.map(id=>{const d=docs[id];return'<div class="card" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:150px"><b>'+esc(d.name)+'</b><div class="mu">القاعة: '+esc(d.hall)+(d.subject?' • '+esc(d.subject):'')+'</div></div><button data-q="'+id+'">QR جديد</button><button class="s" data-r="'+id+'">الحضور</button><button class="s" data-x="'+id+'">حذف</button></div>'}).join('')||'<div class="mu">لا يوجد دكاترة بعد</div>';
 $('sd').innerHTML=ids.map(id=>'<option value="'+id+'">'+esc(docs[id].name)+' - '+esc(docs[id].hall)+'</option>').join('');
 if(cur&&docs[cur])$('sd').value=cur;else if(ids.length)pickDoc(ids[0]);
}
$('dl').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.q)newQR(b.dataset.q);
 if(b.dataset.r){tab(2);$('sd').value=b.dataset.r;pickDoc(b.dataset.r)}
 if(b.dataset.x&&confirm('حذف الدكتور؟ (سجلات الحضور القديمة تبقى محفوظة)'))db.ref('doctors/'+b.dataset.x).remove()};
async function newQR(id){const m=prompt('مدة صلاحية الـ QR بالدقائق','30');if(!m)return;
 const d=docs[id],r=db.ref('sessions').push();
 await r.set({doctorId:id,doctorName:d.name,hall:d.hall,subject:d.subject||'',open:true,createdAt:firebase.database.ServerValue.TIMESTAMP,expiresAt:Date.now()+off+(+m||30)*60000});
 showQR(r.key,d.name+' - '+d.hall)}
function showQR(k,t){
 const url=new URL('student.html?s='+k,location.href).href;
 $('qt').textContent=t;$('qr').innerHTML='';new QRCode($('qr'),{text:url,width:260,height:260});$('qu').textContent=url;$('qm').style.display='flex';
 if(qOff)qOff();const r=db.ref('attendance/'+k),f=r.on('value',s=>$('qn').textContent='المسجلين: '+s.numChildren());qOff=()=>r.off('value',f);
 $('qc').onclick=()=>db.ref('sessions/'+k+'/open').set(false).then(()=>$('qm').style.display='none');
 $('qx').onclick=()=>$('qm').style.display='none'}
$('sd').onchange=()=>pickDoc($('sd').value);
function pickDoc(id){cur=id;if(offS)offS();
 const q=db.ref('sessions').orderByChild('doctorId').equalTo(id),f=q.on('value',s=>{sess=s.val()||{};
  const k=Object.keys(sess).sort((a,b)=>sess[b].createdAt-sess[a].createdAt);
  $('ss').innerHTML=k.map(x=>'<option value="'+x+'">'+fd(sess[x].createdAt)+'</option>').join('')||'<option value="">لا توجد محاضرات</option>';pickSess($('ss').value)});
 offS=()=>q.off('value',f)}
$('ss').onchange=()=>pickSess($('ss').value);
function pickSess(k){if(offA)offA();rows=[];if(!k)return render();
 const r=db.ref('attendance/'+k),f=r.on('value',s=>{rows=Object.values(s.val()||{}).sort((a,b)=>ar(a.name,b.name));render()},e=>alert('لا توجد صلاحية قراءة'));offA=()=>r.off('value',f)}
function table(w){const s=sess[$('ss').value]||{};const c=rows.reduce((m,r)=>(m[r.fp]=(m[r.fp]||0)+1,m),{});
 const th='style="border:1px solid #999;padding:6px;background:#7a1f2b;color:#fff"',td='style="border:1px solid #999;padding:6px"';
 return'<div dir="rtl" style="font-family:Tahoma,Arial;color:#000;background:#fff;padding:12px"><h2 style="color:#7a1f2b;margin:0">May University in Cairo - كشف الحضور</h2><p>الدكتور: <b>'+esc(s.doctorName)+'</b> &nbsp; القاعة: <b>'+esc(s.hall)+'</b>'+(s.subject?' &nbsp; المادة: <b>'+esc(s.subject)+'</b>':'')+'<br>التاريخ: '+(s.createdAt?fd(s.createdAt):'')+' &nbsp; العدد: <b>'+rows.length+'</b></p><table dir="rtl" style="width:100%;border-collapse:collapse;font-size:13px"><tr><th '+th+'>#</th><th '+th+'>الاسم</th><th '+th+'>ID</th><th '+th+'>الجهاز</th><th '+th+'>الوقت</th></tr>'+rows.map((r,i)=>'<tr><td '+td+'>'+(i+1)+'</td><td '+td+'>'+esc(r.name)+'</td><td '+td+'>'+esc(r.studentId)+'</td><td '+td+'>'+esc(r.device)+(!w&&c[r.fp]>1?' ⚠️':'')+'</td><td '+td+'>'+fd(r.ts)+'</td></tr>').join('')+'</table></div>'}
function render(){$('rp').innerHTML=rows.length?table():'<div class="mu">لا يوجد حضور مسجّل بعد</div>';
 $('rp').querySelectorAll('tr').forEach((tr,i)=>{if(i&&rows[i-1]){const b=document.createElement('td');b.innerHTML='<button class="s" style="padding:2px 8px">✕</button>';b.onclick=()=>del(rows[i-1]);tr.appendChild(b)}})}
function del(r){if(!confirm('حذف تسجيل '+r.name+'؟ سيتمكن من التسجيل مجدداً'))return;const k=$('ss').value;
 db.ref().update({['attendance/'+k+'/'+r.studentId]:null,['deviceLocks/'+k+'/'+r.deviceKey]:null})}
const fname=()=>{const s=sess[$('ss').value]||{};return('حضور_'+s.doctorName+'_'+s.hall+'_'+new Date(s.createdAt||0).toISOString().slice(0,10)).replace(/[\\\/:*?"<>|\s]+/g,'_')};
$('xx').onclick=()=>{if(!rows.length)return;const s=sess[$('ss').value];
 const a=[['الدكتور',s.doctorName,'القاعة',s.hall],['التاريخ',fd(s.createdAt),'العدد',rows.length],[],['#','الاسم','ID','الجهاز','الوقت']].concat(rows.map((r,i)=>[i+1,r.name,r.studentId,r.device,fd(r.ts)]));
 const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=[{wch:5},{wch:35},{wch:15},{wch:28},{wch:24}];const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,'الحضور');XLSX.writeFile(wb,fname()+'.xlsx')};
$('xw').onclick=()=>{if(!rows.length)return;const h='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"></head><body dir="rtl">'+table(1)+'<\/body><\/html>';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+h],{type:'application/msword'}));a.download=fname()+'.doc';a.click()};
$('xp').onclick=async()=>{if(!rows.length)return;const h=document.createElement('div');h.style.cssText='position:fixed;left:-9999px;top:0;width:794px;background:#fff';h.innerHTML=table(1);document.body.appendChild(h);
 const cv=await html2canvas(h,{scale:2,backgroundColor:'#fff'});document.body.removeChild(h);
 const pdf=new jspdf.jsPDF('p','mm','a4'),img=cv.toDataURL('image/jpeg',.95),H=cv.height*210/cv.width;let y=0;
 do{pdf.addImage(img,'JPEG',0,-y,210,H);y+=297;if(y<H)pdf.addPage()}while(y<H);pdf.save(fname()+'.pdf')};
</script>
</body></html>
